<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d9efff">
<title>ZER SUPPORT</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#d9efff}
body{display:flex;justify-content:center;overflow-x:hidden}
.page{
  position:relative;
  width:min(100vw,768px);
  line-height:0;
  overflow:hidden;
}
.bg{
  display:block;
  width:100%;
  height:auto;
  user-select:none;
  -webkit-user-drag:none;
}
.hotspot{
  position:absolute;
  left:6.5%;
  width:87%;
  height:11.2%;
  border-radius:28px;
  cursor:pointer;
  background:transparent;
  -webkit-tap-highlight-color:transparent;
  outline:none;
}
.hotspot:focus-visible{
  box-shadow:0 0 0 4px rgba(35,105,255,.85);
}
.social{top:39.7%}
.saweria{top:52.6%}
.donate{top:65.4%}
.discord{top:78.1%}
.note{
  position:fixed;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  padding:8px 14px;
  border-radius:999px;
  background:rgba(15,50,110,.8);
  color:white;
  font:600 12px/1 Arial,sans-serif;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}
@media(max-width:500px){
  .hotspot{left:6%;width:88%;height:11.0%}
}
</style>
</head>
<body>
<div class="page">
  <img class="bg" src="zer-support-bg.png" alt="ZER SUPPORT">

  <!-- Link 1: SocialBuzz -->
  <a class="hotspot social" href="https://socialbuzz.example/" aria-label="SocialBuzz"></a>

  <!-- Link 2: Saweria -->
  <a class="hotspot saweria" href="https://saweria.co/" aria-label="Saweria"></a>

  <!-- Link 3: Donate -->
  <a class="hotspot donate" href="https://example.com/donate" aria-label="Donate"></a>

  <!-- Link 4: Discord -->
  <a class="hotspot discord" href="https://discord.com/" aria-label="Discord"></a>
</div>
</body>
</html>
